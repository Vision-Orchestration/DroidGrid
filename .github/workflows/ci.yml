name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DroidGrid Pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DroidGrid Pro/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Syntax check all Python
        run: |
          find . -name "*.py" -not -path "./.backups/*" \
            -exec python -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" {} \;
      - name: Unit tests (no GUI/CV deps needed)
        run: pytest tests_py/test_convert.py
      - name: Tracker tests
        run: pytest tests_py/test_label_tracker.py
        continue-on-error: true

  config-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mediamtx.yml in sync with cameras.json
        run: python3 scripts/gen_mediamtx_paths.py --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API image builds
        run: docker build -f "DroidGrid Pro/Dockerfile.api" "DroidGrid Pro"
