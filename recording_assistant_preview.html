<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FERN Recording Assistant</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif}
:root{
  --amber:#d97706;--green:#16a34a;--blue:#1d4ed8;--purple:#7c3aed;
  --bg:#0a0a0a;--panel:#111;--border:#222;--dim:#6b7280;--text:#f9fafb;--white:#fff;--accent:#22c55e;
}
#app{
  background:var(--bg);border-radius:12px;overflow:hidden;
  width:min(960px,100vw);height:min(560px,100vh);
  display:flex;flex-direction:column;color:var(--text);
  border:1px solid var(--border);
}
#header{
  background:var(--panel);border-bottom:1px solid var(--border);
  padding:10px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0;
}
#header .logo{font-family:'Space Mono',monospace;font-size:13px;color:var(--dim);font-weight:700;letter-spacing:2px}
#header .subj{font-size:13px;font-weight:500;color:var(--text)}
#header .prog{margin-left:auto;font-size:12px;color:var(--dim);font-family:'Space Mono',monospace}
#body{display:flex;flex:1;min-height:0}
#left{
  width:38%;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;
  padding:16px;gap:8px;flex-shrink:0;
}
#gname{
  font-family:'Space Mono',monospace;font-size:15px;font-weight:700;
  letter-spacing:1px;color:var(--white);text-align:center;min-height:20px;
}
#gcanvas{width:100%;height:220px}
#gcue{font-size:12px;color:var(--dim);text-align:center;line-height:1.6;min-height:48px;white-space:pre-line}
#right{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;gap:8px;transition:background 0.25s;
}
#state-label{
  font-family:'Space Mono',monospace;font-size:13px;letter-spacing:2px;
  color:var(--dim);text-transform:uppercase;
}
#big-num{
  font-family:'Space Mono',monospace;font-size:96px;font-weight:700;
  color:var(--white);line-height:1;min-height:106px;transition:color 0.2s;
}
#rep-label{font-size:13px;color:var(--dim);font-family:'Space Mono',monospace;text-align:center}
#pbar-bg{width:100%;height:5px;background:var(--border);border-radius:3px;margin-top:16px;overflow:hidden}
#pbar{height:5px;background:var(--dim);border-radius:3px;width:0%;transition:width 0.1s linear}
#start-btn{
  margin-top:20px;padding:11px 32px;background:transparent;
  border:1px solid var(--accent);border-radius:6px;color:var(--accent);
  font-family:'Space Mono',monospace;font-size:13px;font-weight:700;
  letter-spacing:2px;cursor:pointer;transition:all 0.15s;
}
#start-btn:hover{background:var(--accent);color:#000}
#footer{
  background:var(--panel);border-top:1px solid var(--border);
  padding:7px 20px;display:flex;justify-content:space-between;
  align-items:center;flex-shrink:0;
}
#footer span{font-size:11px;color:var(--dim);font-family:'Space Mono',monospace}
#speed-row{display:flex;align-items:center;gap:8px}
#speed-row label{font-size:11px;color:var(--dim);font-family:'Space Mono',monospace}
#speed-row select{
  background:var(--panel);border:1px solid var(--border);color:var(--dim);
  border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;
  font-family:'Space Mono',monospace;
}
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <span class="logo">FERN</span>
    <span class="subj">Subject: p12</span>
    <span class="prog" id="prog-text">Ready</span>
  </div>
  <div id="body">
    <div id="left">
      <div id="gname">—</div>
      <canvas id="gcanvas"></canvas>
      <div id="gcue">Press start to begin the session</div>
    </div>
    <div id="right">
      <div id="state-label">press start</div>
      <div id="big-num">—</div>
      <div id="rep-label"></div>
      <div id="pbar-bg"><div id="pbar"></div></div>
      <button id="start-btn" onclick="startSession()">▶  START SESSION</button>
    </div>
  </div>
  <div id="footer">
    <span id="footer-hint">SPACE = start</span>
    <div id="speed-row">
      <label>Preview speed:</label>
      <select id="speed" onchange="updateSpeed()">
        <option value="1">1× real time</option>
        <option value="4" selected>4× fast</option>
        <option value="10">10× demo</option>
      </select>
    </div>
  </div>
</div>

<script>
const GESTURES=['heel_tap','foot_lift','sideway_kick','forward_step','forward_kick','cross_front','flamingo_bend'];
const GESTURES_R2=[...GESTURES].reverse();
const ALL=[...GESTURES,...GESTURES_R2];
const CUES={
  heel_tap:'Tap right HEEL\non the ground',
  foot_lift:'Lift right KNEE\nup then lower',
  sideway_kick:'Kick RIGHT leg\nout to the side',
  forward_step:'Step FORWARD\nwith right foot',
  forward_kick:'KICK right leg\nforward',
  cross_front:'Cross RIGHT leg\nin front of left',
  flamingo_bend:'Bend right knee,\nfoot UP behind you',
  foot_hold:'Stand STILL\nnaturally'
};
const C_MAP={countdown:'#d97706',perform:'#16a34a',rest:'#1d4ed8',break_c:'#7c3aed',done:'#111111'};
const T={countdown:3,gesture:1.5,rest:1.0,reps:7,break_t:10,prestart:2};
let speed=4,running=false,loopId=null,gestureIdx=0,rep=0,phase='idle';

function updateSpeed(){speed=+document.getElementById('speed').value;}

const canvas=document.getElementById('gcanvas');
const ctx=canvas.getContext('2d');

function resizeCanvas(){
  const r=canvas.parentElement.getBoundingClientRect();
  canvas.width=r.width-32;
  canvas.height=220;
}

function drawGesture(name){
  resizeCanvas();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const W=canvas.width,H=canvas.height;
  const cx=W/2,cy=H/2+15,s=H/240;
  const G='#4b5563',A='#22c55e',WH='#f9fafb';

  function line(x1,y1,x2,y2,c,w,dash=false){
    ctx.strokeStyle=c;ctx.lineWidth=w*s;ctx.lineCap='round';
    if(dash)ctx.setLineDash([5*s,3*s]);else ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.setLineDash([]);
  }
  function dot(x,y,c,r=4){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r*s,0,Math.PI*2);ctx.fill();}

  // Hip bar
  line(cx-40*s,cy-80*s,cx+40*s,cy-80*s,WH,3);
  dot(cx-40*s,cy-80*s,G,5); dot(cx+40*s,cy-80*s,G,5);

  // Left leg (always neutral)
  line(cx-30*s,cy-80*s,cx-30*s,cy-8*s,G,5);
  line(cx-30*s,cy-8*s,cx-30*s,cy+60*s,G,5);
  line(cx-30*s,cy+60*s,cx-56*s,cy+60*s,G,4);
  dot(cx-30*s,cy+60*s,G,4);

  // Right leg — varies by gesture
  if(name==='foot_hold'||name==='neutral'){
    line(cx+30*s,cy-80*s,cx+30*s,cy-8*s,G,5);
    line(cx+30*s,cy-8*s,cx+30*s,cy+60*s,G,5);
    line(cx+30*s,cy+60*s,cx+56*s,cy+60*s,G,4);
    dot(cx+30*s,cy+60*s,G,4);
  } else if(name==='heel_tap'){
    line(cx+30*s,cy-80*s,cx+30*s,cy-8*s,A,5);
    line(cx+30*s,cy-8*s,cx+30*s,cy+60*s,A,5);
    line(cx+30*s,cy+60*s,cx+62*s,cy+44*s,A,5);
    dot(cx+30*s,cy+60*s,A,4);
    dot(cx+62*s,cy+58*s,'#fbbf24',6);
  } else if(name==='foot_lift'){
    line(cx+30*s,cy-80*s,cx+52*s,cy-18*s,A,5);
    line(cx+52*s,cy-18*s,cx+36*s,cy+35*s,A,5);
    line(cx+36*s,cy+35*s,cx+62*s,cy+42*s,A,4);
    dot(cx+52*s,cy-18*s,A,5);
  } else if(name==='sideway_kick'){
    line(cx+30*s,cy-80*s,cx+65*s,cy+18*s,A,5);
    line(cx+65*s,cy+18*s,cx+115*s,cy+6*s,A,5);
    line(cx+115*s,cy+6*s,cx+138*s,cy+16*s,A,4);
    line(cx+95*s,cy+28*s,cx+148*s,cy+28*s,A,2,true);
    dot(cx+65*s,cy+18*s,A,4);
  } else if(name==='forward_step'){
    line(cx+30*s,cy-80*s,cx+33*s,cy-5*s,A,5);
    line(cx+33*s,cy-5*s,cx+48*s,cy+60*s,A,5);
    line(cx+48*s,cy+60*s,cx+74*s,cy+60*s,A,4);
    line(cx+58*s,cy+42*s,cx+88*s,cy+42*s,A,2,true);
    dot(cx+48*s,cy+60*s,A,4);
  } else if(name==='forward_kick'){
    line(cx+30*s,cy-80*s,cx+38*s,cy-2*s,A,5);
    line(cx+38*s,cy-2*s,cx+96*s,cy-26*s,A,5);
    line(cx+96*s,cy-26*s,cx+120*s,cy-18*s,A,4);
    dot(cx+38*s,cy-2*s,A,5);
  } else if(name==='cross_front'){
    line(cx+30*s,cy-80*s,cx-2*s,cy+8*s,A,5);
    line(cx-2*s,cy+8*s,cx-16*s,cy+60*s,A,5);
    line(cx-16*s,cy+60*s,cx-42*s,cy+60*s,A,4);
    line(cx+38*s,cy+28*s,cx-8*s,cy+28*s,A,2,true);
    dot(cx-2*s,cy+8*s,A,4);
  } else if(name==='flamingo_bend'){
    line(cx+30*s,cy-80*s,cx+32*s,cy+18*s,A,5);
    line(cx+32*s,cy+18*s,cx+65*s,cy-26*s,A,5);
    line(cx+65*s,cy-26*s,cx+80*s,cy-18*s,A,4);
    line(cx+48*s,cy+12*s,cx+68*s,cy-36*s,A,2,true);
    dot(cx+32*s,cy+18*s,A,5);
  }
}

function setUI(stateKey,label,numStr,repStr,pct){
  const col=C_MAP[stateKey]||'#111';
  const right=document.getElementById('right');
  right.style.background=col;
  document.getElementById('state-label').textContent=label;
  document.getElementById('big-num').textContent=numStr;
  document.getElementById('rep-label').textContent=repStr;
  document.getElementById('pbar').style.width=Math.round(Math.min(1,pct)*100)+'%';
  document.getElementById('pbar').style.background=stateKey==='perform'?'#fff':'#4ade80';
}

function setGesture(g){
  const display=(g==='foot_hold')?'FOOT HOLD':g.replace(/_/g,'  ').toUpperCase();
  document.getElementById('gname').textContent=display;
  document.getElementById('gcue').textContent=CUES[g]||'';
  drawGesture(g);
}

function setProgress(gIdx,r){
  const rnd=gIdx<GESTURES.length?'Round 1':'Round 2';
  document.getElementById('prog-text').textContent=`${rnd}  ·  gesture ${gIdx+1}/${ALL.length}  ·  rep ${r}/${T.reps}`;
}

function clearLoop(){if(loopId){clearInterval(loopId);loopId=null;}}

function startSession(){
  if(running)return;
  running=true;
  document.getElementById('start-btn').style.display='none';
  document.getElementById('footer-hint').textContent='session running...';
  gestureIdx=0;rep=0;
  setUI('done','STARTING IN...','','',0);
  setGesture('foot_hold');
  startPhase('prestart');
}

function startPhase(p){
  clearLoop();
  phase=p;
  const dur=getDur(p);
  const t0=performance.now();
  loopId=setInterval(()=>{
    const elapsed=(performance.now()-t0)/1000*speed;
    const left=Math.max(0,dur-elapsed);
    const pct=Math.min(1,elapsed/dur);
    tickPhase(p,left,pct);
    if(elapsed>=dur){clearLoop();nextPhase(p);}
  },50);
}

function getDur(p){
  if(p==='prestart')return T.prestart;
  if(p==='countdown')return T.countdown;
  if(p==='perform')return T.gesture;
  if(p==='rest')return T.rest;
  if(p==='break_c')return T.break_t;
  return 2;
}

function tickPhase(p,left,pct){
  const g=ALL[gestureIdx]||'foot_hold';
  if(p==='prestart'){
    setUI('done','STARTING IN...',Math.ceil(left).toString(),'',pct);
  } else if(p==='countdown'){
    setUI('countdown',`GET READY  —  rep ${rep+1}/${T.reps}`,Math.ceil(left).toString(),'',pct);
    setGesture(g);setProgress(gestureIdx,rep+1);
  } else if(p==='perform'){
    setUI('perform','G  O  !',left.toFixed(1),`rep ${rep+1} of ${T.reps}`,pct);
  } else if(p==='rest'){
    setUI('rest','REST',left.toFixed(1),'return to neutral',pct);
  } else if(p==='break_c'){
    setUI('break_c','ROUND 1 DONE  —  RELAX',Math.ceil(left).toString(),'Round 2 starts in...',pct);
    setGesture('foot_hold');
  }
}

function nextPhase(p){
  if(p==='prestart')startCountdown();
  else if(p==='countdown')startPhase('perform');
  else if(p==='perform')startPhase('rest');
  else if(p==='rest')afterRest();
  else if(p==='break_c'){gestureIdx++;startCountdown();}
}

function startCountdown(){
  if(gestureIdx>=ALL.length){finishSession();return;}
  rep=0;setGesture(ALL[gestureIdx]);startPhase('countdown');
}

function afterRest(){
  rep++;
  if(rep>=T.reps){
    gestureIdx++;
    if(gestureIdx===GESTURES.length)startPhase('break_c');
    else if(gestureIdx>=ALL.length)finishSession();
    else{rep=0;setGesture(ALL[gestureIdx]);startPhase('countdown');}
  } else {
    startPhase('countdown');
  }
}

function finishSession(){
  clearLoop();running=false;
  setUI('done','SESSION DONE','✓','label JSON auto-saved',1);
  document.getElementById('gname').textContent='DONE';
  document.getElementById('gcue').textContent='Recording complete.\nLabel JSON auto-generated.';
  ctx.clearRect(0,0,canvas.width,canvas.height);
  document.getElementById('prog-text').textContent='Complete ✓';
  document.getElementById('pbar').style.background='#22c55e';
  document.getElementById('footer-hint').textContent='SPACE = new session';
  const btn=document.getElementById('start-btn');
  btn.textContent='▶  NEW SESSION';
  btn.style.display='inline-block';
  btn.onclick=()=>{gestureIdx=0;rep=0;startSession();};
}

window.addEventListener('load',()=>{resizeCanvas();drawGesture('foot_hold');});
window.addEventListener('resize',()=>{resizeCanvas();drawGesture(ALL[gestureIdx]||'foot_hold');});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&!running){e.preventDefault();startSession();}});
</script>
</body>
</html>
