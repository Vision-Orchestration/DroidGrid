<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <style>
      .mono { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; }
      .sans { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    </style>
  </defs>

  <!-- BG -->
  <rect width="900" height="280" fill="#0d1117"/>

  <!-- Subtle grid lines -->
  <g opacity="0.035" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="56" x2="900" y2="56"/>
    <line x1="0" y1="112" x2="900" y2="112"/>
    <line x1="0" y1="168" x2="900" y2="168"/>
    <line x1="0" y1="224" x2="900" y2="224"/>
    <line x1="180" y1="0" x2="180" y2="280"/>
    <line x1="360" y1="0" x2="360" y2="280"/>
    <line x1="540" y1="0" x2="540" y2="280"/>
    <line x1="720" y1="0" x2="720" y2="280"/>
  </g>

  <!-- ── PHONE GRID (right side) ── -->
  <!-- Phone 1 -->
  <rect x="660" y="44" width="56" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <!-- screen -->
  <rect x="665" y="52" width="46" height="70" rx="3" fill="#0d1117"/>
  <!-- tiny video frame lines -->
  <line x1="665" y1="64" x2="711" y2="64" stroke="#21262d" stroke-width="0.8"/>
  <line x1="665" y1="76" x2="711" y2="76" stroke="#21262d" stroke-width="0.8"/>
  <line x1="665" y1="88" x2="711" y2="88" stroke="#21262d" stroke-width="0.8"/>
  <line x1="665" y1="100" x2="711" y2="100" stroke="#21262d" stroke-width="0.8"/>
  <!-- REC dot -->
  <circle cx="703" cy="58" r="3" fill="#f78166" opacity="0.9"/>
  <!-- label -->
  <text x="688" y="145" class="mono sans" font-size="8" fill="#484f58" text-anchor="middle">Phone-1</text>

  <!-- Phone 2 -->
  <rect x="725" y="44" width="56" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="730" y="52" width="46" height="70" rx="3" fill="#0d1117"/>
  <line x1="730" y1="64" x2="776" y2="64" stroke="#21262d" stroke-width="0.8"/>
  <line x1="730" y1="76" x2="776" y2="76" stroke="#21262d" stroke-width="0.8"/>
  <line x1="730" y1="88" x2="776" y2="88" stroke="#21262d" stroke-width="0.8"/>
  <line x1="730" y1="100" x2="776" y2="100" stroke="#21262d" stroke-width="0.8"/>
  <circle cx="768" cy="58" r="3" fill="#f78166" opacity="0.9"/>
  <text x="753" y="145" class="mono sans" font-size="8" fill="#484f58" text-anchor="middle">Phone-2</text>

  <!-- Phone 3 -->
  <rect x="790" y="44" width="56" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="795" y="52" width="46" height="70" rx="3" fill="#0d1117"/>
  <line x1="795" y1="64" x2="841" y2="64" stroke="#21262d" stroke-width="0.8"/>
  <line x1="795" y1="76" x2="841" y2="76" stroke="#21262d" stroke-width="0.8"/>
  <line x1="795" y1="88" x2="841" y2="88" stroke="#21262d" stroke-width="0.8"/>
  <line x1="795" y1="100" x2="841" y2="100" stroke="#21262d" stroke-width="0.8"/>
  <!-- this one is OFFLINE -->
  <rect x="795" y="52" width="46" height="70" rx="3" fill="#0d1117" opacity="0.7"/>
  <text x="818" y="90" class="sans" font-size="8" fill="#484f58" text-anchor="middle">OFFLINE</text>
  <text x="853" y="145" class="mono sans" font-size="8" fill="#484f58" text-anchor="middle">Phone-3</text>

  <!-- WiFi waves connecting phones to PC -->
  <path d="M 688 155 Q 688 170 660 175" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.4" stroke-dasharray="3,2"/>
  <path d="M 753 155 Q 740 172 660 175" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.4" stroke-dasharray="3,2"/>
  <path d="M 818 155 Q 740 172 660 175" fill="none" stroke="#484f58" stroke-width="1" opacity="0.3" stroke-dasharray="2,3"/>

  <!-- PC / DroidGrid node -->
  <rect x="620" y="160" width="84" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" opacity="0.9"/>
  <text x="662" y="176" class="mono sans" font-size="9" fill="#58a6ff" text-anchor="middle">DroidGrid</text>
  <text x="662" y="190" class="mono sans" font-size="8" fill="#3fb950" text-anchor="middle">● live preview</text>

  <!-- mp4 output -->
  <rect x="628" y="218" width="30" height="20" rx="3" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="643" y="232" class="mono sans" font-size="8" fill="#3fb950" text-anchor="middle">.mp4</text>
  <rect x="668" y="218" width="30" height="20" rx="3" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="683" y="232" class="mono sans" font-size="8" fill="#3fb950" text-anchor="middle">.mp4</text>
  <line x1="640" y1="200" x2="640" y2="218" stroke="#30363d" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="683" y1="200" x2="683" y2="218" stroke="#30363d" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- phones row 2 -->
  <rect x="660" y="160" width="56" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="665" y="168" width="46" height="70" rx="3" fill="#0d1117"/>
  <circle cx="703" cy="174" r="3" fill="#f78166" opacity="0.9"/>
  <line x1="665" y1="180" x2="711" y2="180" stroke="#21262d" stroke-width="0.8"/>
  <line x1="665" y1="192" x2="711" y2="192" stroke="#21262d" stroke-width="0.8"/>
  <line x1="665" y1="204" x2="711" y2="204" stroke="#21262d" stroke-width="0.8"/>
  <line x1="665" y1="216" x2="711" y2="216" stroke="#21262d" stroke-width="0.8"/>
  <text x="688" y="261" class="mono sans" font-size="8" fill="#484f58" text-anchor="middle">Phone-4</text>

  <rect x="725" y="160" width="56" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="730" y="168" width="46" height="70" rx="3" fill="#0d1117"/>
  <circle cx="768" cy="174" r="3" fill="#f78166" opacity="0.9"/>
  <line x1="730" y1="180" x2="776" y2="180" stroke="#21262d" stroke-width="0.8"/>
  <line x1="730" y1="192" x2="776" y2="192" stroke="#21262d" stroke-width="0.8"/>
  <line x1="730" y1="204" x2="776" y2="204" stroke="#21262d" stroke-width="0.8"/>
  <line x1="730" y1="216" x2="776" y2="216" stroke="#21262d" stroke-width="0.8"/>
  <text x="753" y="261" class="mono sans" font-size="8" fill="#484f58" text-anchor="middle">Phone-5</text>

  <rect x="790" y="160" width="56" height="92" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="795" y="168" width="46" height="70" rx="3" fill="#0d1117"/>
  <circle cx="833" cy="174" r="3" fill="#f78166" opacity="0.9"/>
  <line x1="795" y1="180" x2="841" y2="180" stroke="#21262d" stroke-width="0.8"/>
  <line x1="795" y1="192" x2="841" y2="192" stroke="#21262d" stroke-width="0.8"/>
  <line x1="795" y1="204" x2="841" y2="204" stroke="#21262d" stroke-width="0.8"/>
  <line x1="795" y1="216" x2="841" y2="216" stroke="#21262d" stroke-width="0.8"/>
  <text x="818" y="261" class="mono sans" font-size="8" fill="#484f58" text-anchor="middle">Phone-6</text>

  <!-- ── LEFT PANEL ── -->
  <!-- accent bar -->
  <rect x="52" y="0" width="3" height="280" fill="#58a6ff" opacity="0.8"/>

  <!-- eyebrow -->
  <rect x="66" y="36" width="130" height="20" rx="10" fill="#161b22"/>
  <rect x="66" y="36" width="130" height="20" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="131" y="50" class="mono sans" font-size="10" fill="#3fb950" text-anchor="middle" letter-spacing="1">VISION-ORCHESTRATION</text>

  <!-- main title -->
  <text x="66" y="130" class="sans" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-3">Droid</text>
  <text x="66" y="163" class="sans" font-size="72" font-weight="800" fill="#58a6ff" letter-spacing="-3">Grid</text>

  <!-- subtitle -->
  <text x="68" y="188" class="sans" font-size="13" fill="#8b949e">Multi-phone DroidCam controller — preview, record, snapshot, auto-reconnect</text>

  <!-- divider -->
  <line x1="66" y1="200" x2="615" y2="200" stroke="#30363d" stroke-width="1"/>

  <!-- feature pills -->
  <rect x="66" y="212" width="86" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="109" y="227" class="sans" font-size="10" fill="#58a6ff" text-anchor="middle">Live preview</text>

  <rect x="160" y="212" width="96" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="208" y="227" class="sans" font-size="10" fill="#58a6ff" text-anchor="middle">Sync recording</text>

  <rect x="264" y="212" width="80" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="304" y="227" class="sans" font-size="10" fill="#3fb950" text-anchor="middle">Auto-reconnect</text>

  <rect x="352" y="212" width="68" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="386" y="227" class="sans" font-size="10" fill="#3fb950" text-anchor="middle">Snapshot</text>

  <rect x="428" y="212" width="80" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="468" y="227" class="sans" font-size="10" fill="#d29922" text-anchor="middle">10 cameras</text>

  <!-- footnote -->
  <text x="68" y="264" class="mono sans" font-size="11" fill="#484f58">v1.0.0 · MIT · Python 3.8+ · OpenCV 4.8+ · No cloud required</text>
</svg>
