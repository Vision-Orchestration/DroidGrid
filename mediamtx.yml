# MediaMTX Configuration — DroidGrid Stream Broker
# Replaces direct MJPEG polling with a central RTSP/WebRTC/HLS broker.
logLevel: info
logDestinations: [stdout]

rtspAddress: :8554
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8889

# WebRTC configuration
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
webrtcIPsFromInterfaces: yes

# API for programmatic control
api: yes
apiAddress: :9997

